<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UT / CEM — Texas Microgrid Lab (External Data, Texas Mask, EIA Tooltips)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css"/>

  <style>
    :root{
      /* Theme colors */
      --ut-burnt: #BF5700;
      --bg-muted: #f5f5f6;
      --map-ui-bg: rgba(255,255,255,0.96);
      --ui-border: rgba(0,0,0,0.06);
      --text: #222;

      /* Map layer colors */
      --tx345: #BF5700;
      --txlow: #2b7aa1;
      --gas: #ff8a33;
      --coal: #7f7f7f;
      --wind: #16a3b5;
      --solar: #f2c94c;
      --nuclear: #8a5fb0;
      --dc: #2ca02c;
    }

    /* Full viewport, avoid white strips */
    html,body {
      height:100%;
      margin:0;
      padding:0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:var(--bg-muted);
      color:var(--text);
      overflow:hidden; /* avoids scrollbars that can reveal white edges */
    }

    /* Map is full screen */
    #map {
      height: 100vh;
      width:100%;
      margin:0;
      padding:0;
      position:relative;
    }

    /* Top-left logo overlay */.logo-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1300;
      background: transparent;
      padding: 0;
      pointer-events: none; /* pass pointer events to the map; set to auto if you want logo clickable */
    }.logo-overlay img {
      height: 36px;  /* adjust to taste */
      display: block;
    }

    /* Legend - bottom-left overlay (title removed for cleanliness) */.legend-box {
      position: absolute;
      left: 14px;
      bottom: 14px;
      z-index: 1100;
      background: var(--map-ui-bg);
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border: 1px solid var(--ui-border);
      width: 300px;
    }.legend-row {
      display:flex; align-items:center; gap:10px;
      margin:6px 0; font-size:13px;
    }.legend-swatch {
      width:22px; height:12px; border-radius:3px;
      border:1px solid rgba(0,0,0,0.06);
    }.legend-circle {
      width:14px; height:14px; border-radius:50%;
      display:inline-block; margin-right:6px; vertical-align:middle;
    }

    /* Controls (bottom-right) */.controls-box {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 1100;
      background: var(--map-ui-bg);
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
      border: 1px solid var(--ui-border);
      width: 200px;
      text-align: center;
    }.controls-box button {
      display:block; width:100%;
      margin:6px 0; padding:8px 10px;
      border-radius:8px; border:1px solid var(--ui-border);
      background:white; cursor:pointer; font-weight:600; color:var(--text);
    }.controls-box button.primary { background:var(--ut-burnt); color:#fff; border:none; }

    /* Timeline slider bottom-center overlay */.timeline-overlay {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      bottom: 14px;
      z-index: 1200;
      background: var(--map-ui-bg);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--ui-border);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      display:flex; gap:12px; align-items:center;
    }.timeline-label { font-weight:700; color:var(--text); min-width:54px; }
    #slider { width:420px; max-width:60vw; }

    /* Layer control: top-left on the map */.leaflet-control-layers { margin-top: 8px; margin-left: 8px; }

    /* Optional: hide Leaflet attribution; ensure compliance if using public tiles */.leaflet-control-attribution { display: none; }.leaflet-popup-content-wrapper { font-size:13px; }
  </style>
</head>
<body>

  <!-- Top-left logo overlay: ensure the file exists next to this HTML -->
  <div class="logo-overlay">
    <img src="ut_cem_logo.png" alt="UT CEM logo"/>
  </div>

  <!-- Map area -->
  <div id="map" role="application" aria-label="Interactive Texas Grid Map"></div>

  <!-- Timeline slider overlay (BOTTOM-CENTER) -->
  <div class="timeline-overlay" aria-hidden="false">
    <div class="timeline-label">Year</div>
    <div id="slider"></div>
    <div id="sliderValue" style="min-width:56px; text-align:center; font-weight:700;">2025</div>
  </div>

  <!-- Legend (bottom-left), heading removed -->
  <div class="legend-box" id="legend" aria-hidden="false">
    <!-- Transmission -->
    <div class="legend-row"><div class="legend-swatch" style="background:var(--tx345)"></div><div>Transmission — 300+ kV</div></div>
    <div class="legend-row"><div class="legend-swatch" style="background:var(--txlow)"></div><div>Transmission — &lt; 300 kV</div></div>
    <!-- Plants -->
    <div class="legend-row"><div class="legend-circle" style="background:var(--gas)"></div><div>Gas Plant</div></div>
    <div class="legend-row"><div class="legend-circle" style="background:var(--coal)"></div><div>Coal Plant</div></div>
    <div class="legend-row"><div class="legend-circle" style="background:var(--wind)"></div><div>Wind Farm</div></div>
    <div class="legend-row"><div class="legend-circle" style="background:var(--solar)"></div><div>Solar Farm</div></div>
    <div class="legend-row"><div class="legend-circle" style="background:var(--nuclear)"></div><div>Nuclear Plant</div></div>
    <!-- Data centers size brackets (by MW where available) -->
    <div class="legend-row"><div class="legend-swatch" style="background:var(--dc); width:14px; height:14px; border-radius:3px;"></div><div>Data Center (size by MW)</div></div>
    <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;background:#2ca02c;opacity:0.7;"></div><div>Small &lt; 50 MW</div></div>
    <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;background:#2ca02c;opacity:0.9;"></div><div>Medium 50–150 MW</div></div>
    <div class="legend-row"><div style="width:14px;height:14px;border-radius:3px;background:#2ca02c;opacity:1;"></div><div>Large &gt; 150 MW</div></div>
  </div>

  <!-- Controls (bottom-right) -->
  <div class="controls-box" role="region" aria-label="Map controls">
    <button id="playPauseBtn" class="primary">⏯ Play Flows</button>
    <button id="resetViewBtn">🔄 Reset View</button>
    <button id="toggleMaskBtn">🗺️ Toggle Texas Mask</button>
  </div>

  <!-- JS libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.11/dist/esri-leaflet.js"></script>

  <script>
  /************************************************************************
   * UT / CEM — Texas Microgrid Lab Map (External Data, Texas Mask, EIA)
   * - Esri Leaflet loads ArcGIS Feature Services (HIFLD Open).
   * - Filters restrict to Texas via STATE attributes where available.
   * - Year slider applies server-side filtering when a year/date field exists.
   * - Optional EIA live data in plant popup (requires EIA_API_KEY).
   ************************************************************************/

  /* ----------------------------------------------------------------------
     Configuration and constants
     ---------------------------------------------------------------------- */
  const EIA_API_KEY = ""; // <-- Optional: paste your EIA API key here to enable live fetch
  // EIA v2 example endpoint for plant generation (monthly net generation):
  // We'll try: https://api.eia.gov/v2/electricity/retail-sales/data/?facets=... (EIA endpoints vary).
  // This demo uses a generic function placeholder. See comments within fetchEIALatest().

  // External data sources (HIFLD / ArcGIS Feature Services)
  // 1) Transmission Lines (USA) — HIFLD Electric Power Transmission Lines
  const URL_TX_LINES = 'https://services3.arcgis.com/66u3n8SiUZhpdI3h/ArcGIS/rest/services/Electric_Power_Transmission_Lines/FeatureServer/0';
  // 2) Power Plants (USA) — HIFLD Power Plants
  const URL_POWER_PLANTS = 'https://services3.arcgis.com/66u3n8SiUZhpdI3h/ArcGIS/rest/services/Power_Plants/FeatureServer/0';
  // 3) Data Centers (USA) — HIFLD Data Centers
  const URL_DATA_CENTERS = 'https://services3.arcgis.com/66u3n8SiUZhpdI3h/ArcGIS/rest/services/Data_Centers/FeatureServer/0';
  // 4) Texas boundary (USA States Generalized)
  const URL_USA_STATES = 'https://services.arcgis.com/P3ePLMYs2RVChkJx/ArcGIS/rest/services/USA_States_Generalized/FeatureServer/0';

  /* ----------------------------------------------------------------------
     Map initialization
     ---------------------------------------------------------------------- */
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([31.0, -99.0], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Colors from CSS Vars
  const css = getComputedStyle(document.documentElement);
  const styles = {
    tx345: css.getPropertyValue('--tx345').trim() || '#BF5700',
    txlow: css.getPropertyValue('--txlow').trim() || '#2b7aa1',
    gas: css.getPropertyValue('--gas').trim() || '#ff8a33',
    coal: css.getPropertyValue('--coal').trim() || '#7f7f7f',
    wind: css.getPropertyValue('--wind').trim() || '#16a3b5',
    solar: css.getPropertyValue('--solar').trim() || '#f2c94c',
    nuclear: css.getPropertyValue('--nuclear').trim() || '#8a5fb0',
    dc: css.getPropertyValue('--dc').trim() || '#2ca02c'
  };

  /* ----------------------------------------------------------------------
     Texas boundary and mask overlays
     ---------------------------------------------------------------------- */
  let texasOutline = null;
  let texasMask = null;
  let maskEnabled = false;

  // Fetch Texas polygon and build outline & mask overlays
  L.esri.query({ url: URL_USA_STATES }).where("STATE_NAME = 'Texas'").run(function(err, featureCollection) {
      if (err || !featureCollection || !featureCollection.features || !featureCollection.features.length) return;
      const txFeature = featureCollection.features[0];
      const txGeom = txFeature.geometry;

      // Outline overlay: emphasize Texas border
      texasOutline = L.geoJSON(txGeom, {
        style: { color: '#333', weight: 2.5, fillOpacity: 0.0 }
      });

      // Mask overlay: shade outside of Texas by building a donut polygon:
      // Outer ring: world rectangle; inner ring: Texas polygon (hole).
      // Note: MultiPolygon requires constructing rings accordingly.
      // We'll approximate the world ring to visible lat/lng extents.
      const worldRing = [
        [85, -180], [85, 180], [-85, 180], [-85, -180]
      ];
      // Extract one large ring from Texas geometry for the hole
      let txHoleRings = [];
      if (txGeom.type === 'Polygon') {
        txHoleRings = txGeom.coordinates[0].map(([lng, lat]) => [lat, lng]);
      } else if (txGeom.type === 'MultiPolygon') {
        // Use the largest ring (by length) as the hole
        let largest = txGeom.coordinates[0][0];
        txGeom.coordinates.forEach(poly => {
          const ring = poly[0];
          if (ring.length > largest.length) largest = ring;
        });
        txHoleRings = largest.map(([lng, lat]) => [lat, lng]);
      }

      // Construct mask Polygon with outer ring (world) and inner ring (Texas hole)
      texasMask = L.polygon([worldRing, txHoleRings], {
        color: 'transparent',
        fillColor: 'rgba(0,0,0,0.15)',
        fillOpacity: 0.15,
        weight: 0,
        interactive: false
      });

      // Add outline by default (mask toggled by button)
      texasOutline.addTo(map);
    });

  document.getElementById('toggleMaskBtn').addEventListener('click', () => {
    maskEnabled = !maskEnabled;
    if (maskEnabled) {
      if (texasMask) texasMask.addTo(map);
    } else {
      if (texasMask) map.removeLayer(texasMask);
    }
  });

  /* ----------------------------------------------------------------------
     External overlays: Transmission, Plants, Data Centers
     ---------------------------------------------------------------------- */

  // Transmission lines — style by kV (>=300 => 345kV color)
  const txTransmission = L.esri.featureLayer({
    url: URL_TX_LINES,
    where: "STATE = 'TX'",
    style: function (feature) {
      const p = feature.properties || {};
      const kv = Number(p.VOLTAGE || p.VOLTAGE_KV || p.kV || p.KV || 0);
      const is345 = kv >= 300;
      return { color: is345 ? styles.tx345 : styles.txlow, weight: is345 ? 3.2 : 2.0, opacity: 0.95 };
    }
  }).addTo(map);

  txTransmission.on('click', function(e) {
    const p = e.layer.feature && e.layer.feature.properties ? e.layer.feature.properties : {};
    const kv = p.VOLTAGE || p.VOLTAGE_KV || 'N/A';
    const owner = p.OWNER || p.COMPANY || 'N/A';
    e.layer.bindPopup(`<b>Transmission Line</b><br>Owner: ${owner}<br>Voltage: ${kv} kV`).openPopup();
  });

  // Power plants — style by primary fuel; popup includes EIA_ID if present
  let plantYearField = null;  // detected later
  let plantDateField = null;  // detected later (date type)
  const plantsLayer = L.esri.featureLayer({
    url: URL_POWER_PLANTS,
    where: "STATE = 'TX'",
    pointToLayer: function (feature, latlng) {
      const p = feature.properties || {};
      const fuel = (p.PRIM_FUEL || p.FUEL || p.FUEL1 || p.FUEL_TYPE || '').toLowerCase();
      const color =
        fuel.includes('wind') ? styles.wind :
        fuel.includes('solar') ? styles.solar :
        fuel.includes('nuclear') ? styles.nuclear :
        fuel.includes('coal') ? styles.coal :
        styles.gas;
      return L.circleMarker(latlng, { radius: 7, fillOpacity: 0.95, color, weight: 1 });
    }
  }).addTo(map);

  // Detect year/date fields via metadata + incoming features
  plantsLayer.metadata(function(err, md) {
    if (md && md.fields) {
      const byName = Object.fromEntries(md.fields.map(f => [f.name, f]));
      const candidatesYear = ['YEAR','IN_SERVICE_YEAR','COMMISSION_YEAR','OPER_YEAR','OP_YEAR'];
      const candidatesDate = ['OPERDATE','IN_SERVICE_DATE','DATE_IN_SERVICE'];
      plantYearField = candidatesYear.find(f => byName[f] && byName[f].type !== 'esriFieldTypeDate') || plantYearField;
      plantDateField = candidatesDate.find(f => byName[f] && byName[f].type === 'esriFieldTypeDate') || plantDateField;
    }
  });
  plantsLayer.on('createfeature', function(e) {
    const props = e.feature && e.feature.properties ? e.feature.properties : {};
    if (!plantYearField) {
      const candidates = ['YEAR','IN_SERVICE_YEAR','COMMISSION_YEAR','OPER_YEAR','OP_YEAR'];
      plantYearField = candidates.find(f => f in props) || plantYearField;
    }
    if (!plantDateField) {
      const candidates = ['OPERDATE','IN_SERVICE_DATE','DATE_IN_SERVICE'];
      plantDateField = candidates.find(f => f in props) || plantDateField;
    }
  });

  plantsLayer.on('click', async function(e) {
    const p = e.layer.feature && e.layer.feature.properties ? e.layer.feature.properties : {};
    const name = p.POWER_PLANT || p.NAME || 'Plant';
    const fuel = p.PRIM_FUEL || p.FUEL || p.FUEL1 || 'N/A';
    const capacity = p.CAPACITY_MW || p.NAMEPLATE || p.MW || 'N/A';
    const eiaId = p.EIA_ID || p.PLANT_CODE || p.PLANT_ID || null;

    // Optional: EIA live data (monthly net generation). Requires EIA_API_KEY.
    let liveLine = '';
    if (EIA_API_KEY && eiaId) {
      try {
        // NOTE: EIA v2 endpoints vary; here's a placeholder using the "electricity" namespace.
        // Replace with a specific series that matches your reporting need, e.g.:
        // net generation monthly by plant: https://api.eia.gov/v2/electricity/retail-sales/data/?api_key=... (placeholder)
        // In practice, consult https://www.eia.gov/opendata/browser/electricity/ for the exact series.
        const latest = await fetchEIALatest(eiaId);
        if (latest) liveLine = `<br><i>Latest net generation:</i> ${latest.value} ${latest.unit} (${latest.period})`;
      } catch (ex) {
        liveLine = '';
      }
    }

    e.layer.bindPopup(
      `<b>${name}</b><br>Fuel: ${fuel}<br>Capacity: ${capacity} MW${eiaId ? `<br>EIA ID: ${eiaId}` : ''}${liveLine}`
    ).openPopup();
  });

  // Data Centers — size brackets by MW if available; otherwise default
  let dcYearField = null;
  let dcDateField = null;
  const dcsLayer = L.esri.featureLayer({
    url: URL_DATA_CENTERS,
    where: "STATE = 'TX'",
    pointToLayer: function (feature, latlng) {
      const p = feature.properties || {};
      // Try common fields for MW/IT load
      const mw = Number(p.MW || p.POWER_MW || p.IT_LOAD_MW || p.CRITICAL_POWER_MW || 0);
      let opacity = 0.7; let radius = 7;
      if (mw >= 150) { opacity = 1.0; radius = 11; }
      else if (mw >= 50) { opacity = 0.9; radius = 9; }

      return L.circleMarker(latlng, { radius, fillOpacity: opacity, color: styles.dc, weight: 1.2 });
    }
  }).addTo(map);

  dcsLayer.metadata(function(err, md) {
    if (md && md.fields) {
      const byName = Object.fromEntries(md.fields.map(f => [f.name, f]));
      const candidatesYear = ['YEAR','COMMISSION_YEAR','IN_SERVICE_YEAR','OPEN_YEAR','BUILD_YEAR'];
      const candidatesDate = ['IN_SERVICE_DATE','OPEN_DATE','DATE_OPENED'];
      dcYearField = candidatesYear.find(f => byName[f] && byName[f].type !== 'esriFieldTypeDate') || dcYearField;
      dcDateField = candidatesDate.find(f => byName[f] && byName[f].type === 'esriFieldTypeDate') || dcDateField;
    }
  });
  dcsLayer.on('createfeature', function(e) {
    const props = e.feature && e.feature.properties ? e.feature.properties : {};
    if (!dcYearField) {
      const candidates = ['YEAR','COMMISSION_YEAR','IN_SERVICE_YEAR','OPEN_YEAR','BUILD_YEAR'];
      dcYearField = candidates.find(f => f in props) || dcYearField;
    }
    if (!dcDateField) {
      const candidates = ['IN_SERVICE_DATE','OPEN_DATE','DATE_OPENED'];
      dcDateField = candidates.find(f => f in props) || dcDateField;
    }
  });

  dcsLayer.on('click', function(e) {
    const p = e.layer.feature && e.layer.feature.properties ? e.layer.feature.properties : {};
    const name = p.NAME || p.SITE_NAME || 'Data Center';
    const company = p.COMPANY || p.OWNER || 'N/A';
    const city = p.CITY || 'TX';
    const mw = p.MW || p.POWER_MW || p.IT_LOAD_MW || 'N/A';
    e.layer.bindPopup(`<b>${name}</b><br>Company: ${company}<br>City: ${city}<br>IT/Power Load: ${mw} MW`).openPopup();
  });

  /* ----------------------------------------------------------------------
     Overlay toggles
     ---------------------------------------------------------------------- */
  const overlays = {
    "TX Transmission (HIFLD)": txTransmission,
    "Power Plants (HIFLD)": plantsLayer,
    "Data Centers (HIFLD)": dcsLayer,
    "Texas Outline": {
      addTo: function(m) { if (texasOutline) texasOutline.addTo(m); },
      removeFrom: function(m) { if (texasOutline) m.removeLayer(texasOutline); }
    }
  };

  // Build a custom layers control to handle the outline pseudo-layer
  const layersControl = L.control.layers(null, null, { collapsed: false, position: 'topleft' }).addTo(map);
  layersControl.addOverlay(txTransmission, "TX Transmission (HIFLD)");
  layersControl.addOverlay(plantsLayer, "Power Plants (HIFLD)");
  layersControl.addOverlay(dcsLayer, "Data Centers (HIFLD)");

  // Add checkbox for Texas Outline
  const outlineLayerGroup = L.layerGroup();
  outlineLayerGroup.on('add', () => { if (texasOutline) texasOutline.addTo(map); });
  outlineLayerGroup.on('remove', () => { if (texasOutline) map.removeLayer(texasOutline); });
  layersControl.addOverlay(outlineLayerGroup, "Texas Outline");

  /* ----------------------------------------------------------------------
     Flow particles on transmission polylines
     ---------------------------------------------------------------------- */
  const flowMarkersGroup = L.layerGroup().addTo(map);
  const flows = [];

  function resetFlowsFromTransmission() {
    flowMarkersGroup.clearLayers();
    flows.length = 0;

    txTransmission.eachFeature(function(layer) {
      const latlngs = layer.getLatLngs();
      const flat = Array.isArray(latlngs[0]) ? latlngs.flat(2) : latlngs;
      if (!flat || flat.length < 2) return;

      const startXY = [flat[0].lng, flat[0].lat];
      const endXY   = [flat[flat.length - 1].lng, flat[flat.length - 1].lat];
      const baseCount = Math.max(1, Math.round(Math.hypot(endXY[0]-startXY[0], endXY[1]-startXY[1]) * 4));

      const props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
      const kv = Number(props.VOLTAGE || props.VOLTAGE_KV || 0);
      const col = kv >= 300 ? styles.tx345 : styles.txlow;

      for (let p = 0; p < baseCount; p++) {
        const start = p / baseCount;
        const speed = 0.0008 + Math.random() * 0.0012;
        const m = L.circleMarker(flat[0], { radius: 3.0, fillOpacity: 0.95, color: col, weight: 0.7 }).addTo(flowMarkersGroup);
        flows.push({ latlngs: flat, progress: start, speed, marker: m });
      }
    });
  }

  function interpolateLatLng(latlngs, t) {
    if (!latlngs || latlngs.length === 0) return null;
    if (t <= 0) return latlngs[0];
    if (t >= 1) return latlngs[latlngs.length - 1];
    const segLens = []; let total = 0;
    for (let i = 1; i < latlngs.length; i++) {
      const a = latlngs[i - 1], b = latlngs[i];
      const dx = b.lng - a.lng, dy = b.lat - a.lat;
      const L = Math.hypot(dx, dy);
      segLens.push(L); total += L;
    }
    let target = t * total, cum = 0;
    for (let i = 0; i < segLens.length; i++) {
      if (cum + segLens[i] >= target) {
        const r = (target - cum) / segLens[i];
        const a = latlngs[i], b = latlngs[i + 1];
        return L.latLng(a.lat + (b.lat - a.lat) * r, a.lng + (b.lng - a.lng) * r);
      }
      cum += segLens[i];
    }
    return latlngs[latlngs.length - 1];
  }

  let animRunning = false, lastTime = null;
  function animateFlows(timestamp) {
    if (!animRunning) { lastTime = null; return; }
    if (!lastTime) lastTime = timestamp;
    const dt = timestamp - lastTime; lastTime = timestamp;
    const factor = dt / 16.67;
    flows.forEach(f => {
      f.progress += f.speed * factor;
      if (f.progress > 1) f.progress -= Math.floor(f.progress);
      const pt = interpolateLatLng(f.latlngs, f.progress);
      if (pt) f.marker.setLatLng(pt);
    });
    requestAnimationFrame(animateFlows);
  }

  document.getElementById('playPauseBtn').addEventListener('click', () => {
    animRunning = !animRunning;
    document.getElementById('playPauseBtn').textContent = animRunning ? '⏸ Pause Flows' : '⏯ Play Flows';
    if (animRunning) requestAnimationFrame(animateFlows);
    else lastTime = null;
  });

  document.getElementById('resetViewBtn').addEventListener('click', () => map.setView([31.0, -99.0], 6));

  txTransmission.on('load', resetFlowsFromTransmission);
  resetFlowsFromTransmission();

  /* ----------------------------------------------------------------------
     Timeline slider — server-side year filtering for plants and DCs
     ---------------------------------------------------------------------- */
  const slider = document.getElementById('slider');
  const sliderValue = document.getElementById('sliderValue');

  const minYear = 1990;
  const maxYear = new Date().getFullYear();

  noUiSlider.create(slider, {
    start: [maxYear],
    connect: true,
    step: 1,
    range: { min: minYear, max: maxYear },
    tooltips: true,
    format: { to: v => Math.round(v), from: v => Number(v) }
  });

  // Build server-side WHERE clause for numeric year or date fields
  function buildYearWhere(baseWhere, yearField, dateField, year) {
    if (dateField) {
      // ArcGIS date literal syntax; many services accept DATE 'YYYY-MM-DD'
      return `${baseWhere} AND ${dateField} <= DATE '${year}-12-31'`;
    }
    if (yearField) {
      return `${baseWhere} AND ${yearField} <= ${year}`;
    }
    return baseWhere; // no year filter available
  }

  slider.noUiSlider.on('update', (values, handle) => {
    const y = parseInt(values[handle], 10);
    sliderValue.textContent = y;

    // Update plants
    const plantBase = "STATE = 'TX'";
    const plantWhere = buildYearWhere(plantBase, plantYearField, plantDateField, y);
    plantsLayer.setWhere(plantWhere);

    // Update data centers
    const dcBase = "STATE = 'TX'";
    const dcWhere = buildYearWhere(dcBase, dcYearField, dcDateField, y);
    dcsLayer.setWhere(dcWhere);
  });

  slider.noUiSlider.set(maxYear);

  /* ----------------------------------------------------------------------
     Fit map to content after initial loads
     ---------------------------------------------------------------------- */
  function fitToLayers() {
    const group = L.featureGroup();
    txTransmission.eachFeature(l => group.addLayer(l));
    plantsLayer.eachFeature(l => group.addLayer(l));
    dcsLayer.eachFeature(l => group.addLayer(l));
    const b = group.getBounds();
    if (b.isValid()) map.fitBounds(b.pad(0.12));
  }
  txTransmission.on('load', fitToLayers);
  plantsLayer.on('load', fitToLayers);
  dcsLayer.on('load', fitToLayers);
