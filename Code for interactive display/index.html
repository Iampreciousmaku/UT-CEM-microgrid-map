<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Grid Interactive Map</title>

  <link rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { margin: 0; }
    #map { height: 100vh; width: 100vw; }
  </style>
</head>

<body>
<div id="map"></div>

<script>
/* ===========================
   SAMPLE GEOJSON DATA
   (Transmission, Plants, Data Centers)
   =========================== */
   
const TX_TRANSMISSION = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": { "voltage": "345 kV" },
      "geometry": { "type": "LineString",
        "coordinates": [
          [-96.7969, 32.7763],
          [-97.7431, 30.2672]
        ]}
    },
    {
      "type": "Feature",
      "properties": { "voltage": "345 kV" },
      "geometry": { "type": "LineString",
        "coordinates": [
          [-97.7431, 30.2672],
          [-95.3698, 29.7604]
        ]}
    },
    {
      "type": "Feature",
      "properties": { "voltage": "138 kV" },
      "geometry": { "type": "LineString",
        "coordinates": [
          [-98.4936, 29.4241],
          [-97.7431, 30.2672]
        ]}
    }
  ]
};

const TX_PLANTS = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature",
      "properties": { "name": "South Texas Nuclear", "fuel": "Nuclear", "capacity": 2500 },
      "geometry": { "type": "Point", "coordinates": [-96.064, 28.797] }
    },
    { "type": "Feature",
      "properties": { "name": "Panda Temple I", "fuel": "Gas", "capacity": 758 },
      "geometry": { "type": "Point", "coordinates": [-97.3428, 31.1171] }
    },
    { "type": "Feature",
      "properties": { "name": "Roscoe Wind Farm", "fuel": "Wind", "capacity": 781 },
      "geometry": { "type": "Point", "coordinates": [-100.476, 32.304] }
    },
    { "type": "Feature",
      "properties": { "name": "Large Solar Farm", "fuel": "Solar", "capacity": 400 },
      "geometry": { "type": "Point", "coordinates": [-99.193, 27.506] }
    },
    { "type": "Feature",
      "properties": { "name": "Austin Energy Decker", "fuel": "Gas", "capacity": 900 },
      "geometry": { "type": "Point", "coordinates": [-97.598, 30.279] }
    }
  ]
};

const TX_DATACENTERS = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature",
      "properties": { "name": "Google Midlothian DC", "load": 250 },
      "geometry": { "type": "Point", "coordinates": [-96.994, 32.484] }
    },
    { "type": "Feature",
      "properties": { "name": "Meta Temple DC", "load": 200 },
      "geometry": { "type": "Point", "coordinates": [-97.346, 31.15] }
    },
    { "type": "Feature",
      "properties": { "name": "Microsoft San Antonio DC", "load": 180 },
      "geometry": { "type": "Point", "coordinates": [-98.395, 29.457] }
    }
  ]
};

/* ===========================
   LEAFLET MAP INITIALIZATION
   =========================== */

const map = L.map('map').setView([31.0, -99.0], 6);

// Base layer
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

// Transmission layer
const transmissionLayer = L.geoJSON(TX_TRANSMISSION, {
  style: f => ({
    color: f.properties.voltage === "345 kV" ? "#ff0000" : "#0000ff",
    weight: f.properties.voltage === "345 kV" ? 3 : 2
  })
});

// Plants layer
const plantLayer = L.geoJSON(TX_PLANTS, {
  pointToLayer: (f, latlng) => {
    return L.circleMarker(latlng, {
      radius: 7,
      fillOpacity: 0.9,
      color: f.properties.fuel === "Wind" ? "#1e90ff" :
             f.properties.fuel === "Solar" ? "#e6c200" :
             f.properties.fuel === "Nuclear" ? "#800080" :
             "#ff6600"
    });
  },
  onEachFeature: (f, layer) => {
    layer.bindPopup(`<b>${f.properties.name}</b><br>
                     Fuel: ${f.properties.fuel}<br>
                     Capacity: ${f.properties.capacity} MW`);
  }
});

// Data centers
const datacenterLayer = L.geoJSON(TX_DATACENTERS, {
  pointToLayer: (f, latlng) => {
    return L.circleMarker(latlng, {
      radius: 8,
      fillOpacity: 0.9,
      color: "#0055ff"
    });
  },
  onEachFeature: (f, layer) => {
    layer.bindPopup(`<b>${f.properties.name}</b><br>
                     Load: ${f.properties.load} MW`);
  }
});

// Add layers to map
transmissionLayer.addTo(map);
plantLayer.addTo(map);
datacenterLayer.addTo(map);

// Layer toggles
L.control.layers(null, {
  "Transmission Lines": transmissionLayer,
  "Power Plants": plantLayer,
  "Data Centers": datacenterLayer
}).addTo(map);

</script>
</body>
</html>
