<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>UT / CEM - Texas Microgrid Lab</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.css"/>

  <style>
    :root{
      --ut-burnt: #BF5700;
      --bg-muted: #eef1f4;
      --map-ui-bg: rgba(255,255,255,0.92);
      --map-ui-strong: rgba(255,255,255,0.98);
      --ui-border: rgba(15,23,42,0.12);
      --text: #17202a;
      --text-muted: #667085;
      --panel-shadow: 0 14px 34px rgba(15,23,42,0.15);

      --gas: #16803a;
      --coal: #6b7280;
      --wind: #0891b2;
      --solar: #d4a72c;
      --nuclear: #7c3aed;
      --hydro: #2563eb;
      --battery: #c026d3;
      --biomass: #334155;
      --petroleum: #4f46e5;
      --dc:  #FF0000;
      --transmission: #e87522;

      --logo-h: 54px;
      --logo-pad: 16px;
      --legend-pad: 16px;
      --legend-h: 150px;
      --gap-above-legend: 12px;
    }

    html,body {
      height:100%;
      margin:0;
      padding:0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background:var(--bg-muted);
      color:var(--text);
      overflow:hidden;
    }

    #map {
      height: 100vh;
      width:100%;
      margin:0;
      padding:0;
      position:relative;
      background:#d9dee4;
    }

    #map::after {
      content:"";
      position:absolute;
      inset:0;
      z-index:1000;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,0.08), inset 0 0 90px rgba(15,23,42,0.10);
    }

    .glass-panel {
      background: var(--map-ui-bg);
      border: 1px solid var(--ui-border);
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .logo-overlay {
      position: absolute;
      top: var(--logo-pad);
      left: var(--logo-pad);
      z-index: 1300;
      padding: 8px 10px;
      border-radius: 8px;
      pointer-events: none;
      background: var(--map-ui-strong);
      border: 1px solid var(--ui-border);
      box-shadow: 0 10px 24px rgba(15,23,42,0.12);
    }.logo-overlay .logo-img {
      height: var(--logo-h);
      width: auto;
      display: block;
      background: transparent;
    }

    .title-panel {
      position:absolute;
      top: 92px;
      left: 16px;
      z-index: 1200;
      width: 310px;
      padding: 14px;
      border-radius: 8px;
    }.title-panel h1 {
      margin: 0 0 6px;
      font-size: 17px;
      line-height: 1.2;
      font-weight: 800;
      color: #111827;
    }.title-panel .subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
    }.metric-grid {
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }.metric {
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 8px;
      padding: 9px 8px;
      background: rgba(248,250,252,0.86);
    }.metric-value {
      display:block;
      font-size: 16px;
      line-height: 1;
      font-weight: 800;
      color: #111827;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }.metric-label {
      display:block;
      margin-top: 5px;
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .filter-box {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1200;
      width: 310px;
      padding: 12px;
      border-radius: 8px;
    }.filter-title {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 800;
      font-size: 12px;
      color: #111827;
      text-transform: uppercase;
    }.filter-count {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      text-transform:none;
    }.search-input {
      width: 100%;
      box-sizing: border-box;
      height: 36px;
      border: 1px solid rgba(15,23,42,0.14);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text);
      background: #fff;
      outline: none;
      font: inherit;
      font-size: 12px;
    }.search-input:focus {
      border-color: rgba(191,87,0,0.55);
      box-shadow: 0 0 0 3px rgba(191,87,0,0.12);
    }.fuel-filter-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 10px;
    }.fuel-chip {
      min-width: 0;
      height: 28px;
      border: 1px solid rgba(15,23,42,0.12);
      border-radius: 8px;
      background: rgba(255,255,255,0.92);
      color: #334155;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }.fuel-chip.active {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }.fuel-chip:hover,
    .controls-box button:hover {
      border-color: rgba(191,87,0,0.35);
      box-shadow: 0 8px 18px rgba(15,23,42,0.12);
    }

    .legend-box {
      position: absolute;
      left: var(--legend-pad);
      bottom: var(--legend-pad);
      z-index: 1100;
      padding: 11px 12px;
      border-radius: 8px;
      width: 250px;
      max-height: min(38vh, 320px);
      overflow:auto;
    }.panel-heading {
      margin:0 0 8px;
      font-size:11px;
      font-weight:900;
      color:#111827;
      text-transform:uppercase;
    }.legend-grid {
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
    }.legend-row {
      display:flex;
      align-items:center;
      gap:7px;
      min-height:20px;
      font-size:11px;
      font-weight:650;
      color:#475467;
    }.legend-swatch {
      flex:0 0 20px;
      width:20px;
      height:9px;
      border-radius:3px;
      border:1px solid rgba(15,23,42,0.08);
    }.legend-circle {
      flex:0 0 10px;
      width:10px;
      height:10px;
      border-radius:50%;
      display:inline-block;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 0 0 1px rgba(15,23,42,0.08);
    }

    .controls-box {
      position: absolute;
      right: 16px;
      bottom: 16px;
      z-index: 1200;
      padding: 8px;
      border-radius: 8px;
      width: 142px;
      text-align: center;
    }.controls-box button {
      display:block;
      width:100%;
      margin:0;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid rgba(15,23,42,0.12);
      background:white;
      cursor:pointer;
      font-weight:800;
      font-size:12px;
      color:#17202a;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }.controls-box button.primary { background:var(--ut-burnt); color:#fff; border:none; }

    .timeline-overlay {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      z-index: 1200;
      padding: 10px 12px;
      border-radius: 8px;
      display:flex;
      gap:12px;
      align-items:center;
      min-width: 500px;
    }.timeline-label {
      font-weight:900;
      color:#111827;
      min-width:42px;
      font-size:11px;
      text-transform:uppercase;
    }
    #slider { flex:1; min-width:300px; max-width:420px; }
    #sliderValue { color:#111827; }
    .noUi-target {
      border: 0;
      box-shadow: none;
      background: rgba(15,23,42,0.12);
      height: 6px;
    }.noUi-connect { background: var(--ut-burnt); }
    .noUi-horizontal .noUi-handle {
      width: 18px;
      height: 18px;
      right: -9px;
      top: -6px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: var(--ut-burnt);
      box-shadow: 0 5px 14px rgba(15,23,42,0.25);
    }.noUi-handle:before,
    .noUi-handle:after { display:none; }
    .noUi-tooltip {
      border: 1px solid rgba(15,23,42,0.12);
      background: #fff;
      color: #111827;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
    }

    .leaflet-bottom.leaflet-left {
      bottom: calc(var(--legend-pad) + var(--legend-h) + var(--gap-above-legend));
      left: var(--legend-pad);
      z-index: 1201;
    }

    .leaflet-control-layers,
    .leaflet-control-zoom {
      border: 1px solid var(--ui-border) !important;
      border-radius: 8px !important;
      box-shadow: 0 10px 24px rgba(15,23,42,0.16) !important;
      overflow: hidden;
      background: var(--map-ui-strong) !important;
    }.leaflet-control-layers-expanded {
      padding: 8px 10px 8px 8px !important;
      color:#17202a;
      font-size:12px;
      font-weight:700;
    }.leaflet-control-layers label {
      margin: 4px 0;
    }.leaflet-control-zoom a {
      color:#17202a !important;
      border-color: rgba(15,23,42,0.10) !important;
    }.leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: 0 16px 42px rgba(15,23,42,0.22);
      font-size:12px;
    }.leaflet-popup-content { margin: 12px 14px; }
    .popup-title {
      font-size:14px;
      font-weight:900;
      color:#111827;
      margin-bottom:8px;
    }.popup-grid {
      display:grid;
      grid-template-columns:auto 1fr;
      gap:5px 12px;
      min-width: 220px;
    }.popup-label { color:var(--text-muted); font-weight:800; }.popup-value { color:#17202a; }

    @media (max-width: 900px) {
      :root { --logo-h: 42px; --logo-pad: 10px; }
      .title-panel,
      .filter-box {
        left: 10px;
        right: 10px;
        width: auto;
      }
      .title-panel { top: 72px; }
      .filter-box { top: auto; bottom: 92px; }
      .dc-search-box { top: auto; bottom: 24px; display:none; }
      .fuel-filter-grid { grid-template-columns: repeat(3, 1fr); }
      .legend-box { display:none; }
      .timeline-overlay {
        left: 10px;
        right: 10px;
        transform: none;
        min-width: 0;
        justify-content: space-between;
      }
      #slider { width: 100%; min-width: 0; max-width: none; }
      .controls-box { display:none; }
      .leaflet-bottom.leaflet-left { bottom: 14px; }
    }
  </style>
</head>
<body>
  <!-- Transparent, shrunk logo overlay -->
  <div class="logo-overlay">
    <img class="logo-img" src="cem_logo.png" alt="UT CEM logo"
         style="height: var(--logo-h); width: auto;"/>
  </div>

  <!-- Map -->
  <div id="map" role="application" aria-label="Interactive Texas Grid Map"></div>

  <section class="title-panel glass-panel" aria-label="Map summary">
    <h1>Texas Grid Asset Map</h1>
    <p class="subtitle">Generation, transmission corridors, and data center load centers across Texas.</p>
    <div class="metric-grid">
      <div class="metric"><span class="metric-value" id="metricPlants">--</span><span class="metric-label">Plants</span></div>
      <div class="metric"><span class="metric-value" id="metricCapacity">--</span><span class="metric-label">GW</span></div>
      <div class="metric"><span class="metric-value" id="metricFuel">All</span><span class="metric-label">Fuel</span></div>
    </div>
  </section>

  <section class="filter-box glass-panel" aria-label="Plant filters">
    <div class="filter-title">
      <span>Plant Search</span>
      <span class="filter-count" id="filterCount">-- shown</span>
    </div>
    <input id="plantSearch" class="search-input" type="search" placeholder="Search name, operator, city, county" autocomplete="off" />
    <div class="fuel-filter-grid" id="fuelFilters" aria-label="Fuel type filters"></div>
  </section>

  <!-- Timeline slider -->
  <div class="timeline-overlay glass-panel" aria-hidden="false">
    <div class="timeline-label">Year</div>
    <div id="slider"></div>
    <div id="sliderValue" style="min-width:56px; text-align:center; font-weight:700;">2000</div>
  </div>

  <!-- Legend -->
  <div class="legend-box glass-panel" id="legend" aria-hidden="false">
    <div class="panel-heading">Legend</div>
    <div class="legend-grid">
      <div class="legend-row"><div class="legend-circle" style="background:var(--gas)"></div><div>Gas</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--coal)"></div><div>Coal</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--wind)"></div><div>Wind</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--solar)"></div><div>Solar</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--nuclear)"></div><div>Nuclear</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--hydro)"></div><div>Hydro</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--battery)"></div><div>Battery</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--biomass)"></div><div>Biomass</div></div>
      <div class="legend-row"><div class="legend-circle" style="background:var(--petroleum)"></div><div>Petroleum</div></div>
      <div class="legend-row"><div class="legend-swatch" style="background:var(--dc); width:14px; height:14px; border-radius:3px;"></div><div>Data center</div></div>
      <div class="legend-row"><div class="legend-swatch" style="background:var(--transmission); height:3px;"></div><div>Transmission</div></div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-box glass-panel" role="region" aria-label="Map controls">
    <button id="resetViewBtn">Reset View</button>
  </div>

  <!-- JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.0/nouislider.min.js"></script>

  /* Map initialization: disable default zoom (we add our own at bottom-left) */
  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([31.0, -99.0], 6);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
    attribution: '� OpenStreetMap contributors � CARTO'
  }).addTo(map);

  map.createPane('transmissionPane');
  map.getPane('transmissionPane').style.zIndex = 390;
  map.createPane('assetPane');
  map.getPane('assetPane').style.zIndex = 430;
  map.createPane('loadPane');
  map.getPane('loadPane').style.zIndex = 440;

  /* Add zoom control at bottom-left */
  L.control.zoom({ position: 'bottomleft' }).addTo(map);

  /* Layer groups */
  const plantsGroup = L.layerGroup().addTo(map);
  const dcsGroup = L.layerGroup().addTo(map);
  const transmissionGroup = L.layerGroup().addTo(map);

  /* Styles from CSS variables */
  const css = getComputedStyle(document.documentElement);
  const styles = {
    gas: css.getPropertyValue('--gas').trim() || '#ff8a33',
    coal: css.getPropertyValue('--coal').trim() || '#7f7f7f',
    wind: css.getPropertyValue('--wind').trim() || '#16a3b5',
    solar: css.getPropertyValue('--solar').trim() || '#f2c94c',
    nuclear: css.getPropertyValue('--nuclear').trim() || '#8a5fb0',
    hydro: css.getPropertyValue('--hydro').trim() || '#2f80ed',
    battery: css.getPropertyValue('--battery').trim() || '#d946ef',
    biomass: css.getPropertyValue('--biomass').trim() || '#4f8f3a',
    petroleum: css.getPropertyValue('--petroleum').trim() || '#6d5dfc',
    dc: css.getPropertyValue('--dc').trim() || '#2ca02c',
    transmission: css.getPropertyValue('--transmission').trim() || '#111827'
  };

  const fuelOrder = ['All', 'Gas', 'Wind', 'Solar', 'Battery', 'Coal', 'Nuclear', 'Hydro', 'Biomass', 'Petroleum'];
  let activeFuel = 'All';
  let plantSearchQuery = '';

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function cleanText(value) {
    const text = String(value ?? '').trim();
    return text && text.toLowerCase() !== 'tbd' ? text : '';
  }

  function formatNumber(value, digits = 0) {
    const n = Number(value);
    if (!Number.isFinite(n)) return 'N/A';
    return n.toLocaleString(undefined, { maximumFractionDigits: digits });
  }

  function getFeatureYear(feature) {
    const p = feature && feature.properties ? feature.properties : {};
    const commissionYear = Number(p.commission_year);
    if (Number.isFinite(commissionYear)) return commissionYear;

    const periodYear = Number(String(p.period || '').slice(0, 4));
    return Number.isFinite(periodYear) ? periodYear : null;
  }

  function getPlantMatches(year) {
    const q = plantSearchQuery.trim().toLowerCase();
    return TX_PLANTS.features.filter(f => {
      const p = f.properties || {};
      const y = getFeatureYear(f);
      const matchesYear = y !== null && y <= year;
      const matchesVisibleFuel = p.fuel !== 'Other';
      const matchesFuel = activeFuel === 'All' || p.fuel === activeFuel;
      const haystack = [p.name, p.operator, p.city, p.county, p.technology, p.primary_source].join(' ').toLowerCase();
      const matchesSearch = !q || haystack.includes(q);
      return matchesYear && matchesVisibleFuel && matchesFuel && matchesSearch;
    });
  }

  function updateSummary(features) {
    const capacityMw = features.reduce((sum, f) => sum + (Number(f.properties && f.properties.capacity) || 0), 0);
    document.getElementById('metricPlants').textContent = formatNumber(features.length);
    document.getElementById('metricCapacity').textContent = formatNumber(capacityMw / 1000, 1);
    document.getElementById('metricFuel').textContent = activeFuel;
    document.getElementById('filterCount').textContent = `${formatNumber(features.length)} shown`;
  }

  function buildFuelFilters() {
    const container = document.getElementById('fuelFilters');
    if (!container) return;
    const counts = TX_PLANTS.features.reduce((acc, feature) => {
      const fuel = feature.properties && feature.properties.fuel;
      acc[fuel] = (acc[fuel] || 0) + 1;
      return acc;
    }, {});

    container.innerHTML = '';
    fuelOrder.forEach(fuel => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `fuel-chip${fuel === activeFuel ? ' active' : ''}`;
      button.textContent = fuel;
      button.title = fuel === 'All' ? `Show all ${formatNumber(TX_PLANTS.features.length)} plants` : `Show ${formatNumber(counts[fuel] || 0)} ${fuel.toLowerCase()} plants`;
      button.addEventListener('click', () => {
        activeFuel = fuel;
        buildFuelFilters();
        populatePlants(parseInt(sliderValue.textContent, 10) || maxYear);
      });
      container.appendChild(button);
    });
  }
  function plantColor(fuel) {
    if (!fuel) return styles.gas;
    switch ((fuel || '').toLowerCase()) {
      case 'wind': return styles.wind;
      case 'solar': return styles.solar;
      case 'nuclear': return styles.nuclear;
      case 'coal': return styles.coal;
      case 'gas': return styles.gas;
      case 'hydro': return styles.hydro;
      case 'battery': return styles.battery;
      case 'biomass': return styles.biomass;
      case 'petroleum': return styles.petroleum;
      default: return styles.petroleum;
    }
  }

  function plantRadius(capacity) {
    const mw = Number(capacity);
    if (!Number.isFinite(mw) || mw <= 0) return 5;
    return Math.max(3.2, Math.min(10, 3 + Math.sqrt(mw) / 6));
  }

  function populatePlants(year) {
    plantsGroup.clearLayers();
    const matchingFeatures = getPlantMatches(year);
    const filtered = {
      type: 'FeatureCollection',
      features: matchingFeatures
    };
    const pfl = L.geoJSON(filtered, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
        radius: plantRadius(feature.properties && feature.properties.capacity),
        pane: 'assetPane',
        fillOpacity: 0.78,
        opacity: 0.9,
        color: '#ffffff',
        fillColor: plantColor(feature.properties && feature.properties.fuel),
        weight: 1.25
      }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const location = [cleanText(p.city), cleanText(p.county) && `${cleanText(p.county)} County`].filter(Boolean).join(', ');
        const rows = [
          ['Fuel', p.fuel || 'N/A'],
          ['Capacity', `${formatNumber(p.capacity, 1)} MW`],
          ['Operator', cleanText(p.operator) || 'N/A'],
          ['Location', location || 'N/A'],
          ['Technology', cleanText(p.technology) || 'N/A'],
          ['Year', getFeatureYear(feature) || 'N/A'],
          ['Data', p.period || 'N/A']
        ];
        const rowHtml = rows.map(([label, value]) => `<span class="popup-label">${escapeHtml(label)}</span><span class="popup-value">${escapeHtml(value)}</span>`).join('');
        layer.bindPopup(`<div class="popup-title">${escapeHtml(p.name || 'Plant')}</div><div class="popup-grid">${rowHtml}</div>`);
      }
    });
    plantsGroup.addLayer(pfl);
    updateSummary(matchingFeatures);
  }

  function populateDCs(year) {
    dcsGroup.clearLayers();
    const filtered = {
      type: 'FeatureCollection',
      features: TX_DATACENTERS.features.filter(f => {
        const featureYear = getFeatureYear(f);
        return featureYear !== null && featureYear <= year;
      })
    };
    const dcl = L.geoJSON(filtered, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, { pane: 'loadPane', radius: 6.5, fillOpacity: 0.82, opacity: 0.95, color: '#ffffff', fillColor: styles.dc, weight: 1.4 }),
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const rows = [
          ['Operator', cleanText(p.operator) || 'N/A'],
          ['Address', cleanText(p.address) || cleanText(p.city) || 'N/A'],
          ['Market Count', p.market_count ? `${formatNumber(p.market_count)} facilities` : 'N/A'],
          ['Load', p.load ? `${formatNumber(p.load)} MW` : 'N/A'],
          ['Source', cleanText(p.source) || 'N/A'],
          ['Year', p.commission_year || 'N/A']
        ];
        const rowHtml = rows.map(([label, value]) => `<span class="popup-label">${escapeHtml(label)}</span><span class="popup-value">${escapeHtml(value)}</span>`).join('');
        layer.bindPopup(`<div class="popup-title">${escapeHtml(p.name || 'Data Center')}</div><div class="popup-grid">${rowHtml}</div>`);
      }
    });
    dcsGroup.addLayer(dcl);
  }

  function transmissionStyle(feature) {
    const voltage = String(feature.properties && feature.properties.voltage || '');
    const planned = String(feature.properties && feature.properties.status || '').toLowerCase().includes('planned');
    return {
      color: planned ? '#7c3aed' : styles.transmission,
      weight: voltage.includes('765') ? 4 : 2.6,
      opacity: planned ? 0.72 : 0.68,
      dashArray: planned ? '8 6' : null
    };
  }

  function populateTransmissionLines() {
    transmissionGroup.clearLayers();
    const lineLayer = L.geoJSON(TX_TRANSMISSION_LINES, {
      style: transmissionStyle,
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const rows = [
          ['Voltage', cleanText(p.voltage) || 'N/A'],
          ['Status', cleanText(p.status) || 'N/A'],
          ['Source', cleanText(p.source) || 'N/A']
        ];
        const rowHtml = rows.map(([label, value]) => `<span class="popup-label">${escapeHtml(label)}</span><span class="popup-value">${escapeHtml(value)}</span>`).join('');
        layer.bindPopup(`<div class="popup-title">${escapeHtml(p.name || 'Transmission Line')}</div><div class="popup-grid">${rowHtml}</div>`);
      }
    });
    transmissionGroup.addLayer(lineLayer);
  }
  const allYears = [].concat(
    TX_PLANTS.features.map(getFeatureYear),
    TX_DATACENTERS.features.map(getFeatureYear)
  ).filter(y => Number.isFinite(y));
  const minYear = Math.max(2000, Math.min(...allYears));
  const maxYear = Math.max(...allYears, new Date().getFullYear());
  

  buildFuelFilters();
  populatePlants(maxYear);
  populateDCs(maxYear);
  populateTransmissionLines();

  /* High-resolution Texas border from local texas.geojson (place next to HTML) */
  let texasBorderLayer = null;

  async function loadTexasBorder() {
    try {
      const res = await fetch('texas.geojson'); // local file
      if (!res.ok) throw new Error('texas.geojson not found');
      const geo = await res.json();
      texasBorderLayer = L.geoJSON(geo, {
        style: () => ({ color: '#333', weight: 2.5, fillOpacity: 0, opacity: 1.0 }),
        interactive: false
      }).addTo(map);
    } catch (e) {
      // Fallback small outline so the toggle still works
      texasBorderLayer = L.geoJSON(TEXAS_FALLBACK, {
        style: () => ({ color: '#333', weight: 2.5, fillOpacity: 0, opacity: 1.0 }),
        interactive: false
      }).addTo(map);
      console.warn('Texas border: using fallback outline. Reason:', e.message);
    }

    // Build layer control after we have the border layer
    buildLayerControl();
  }

  function buildLayerControl() {
    const overlays = {
      "Power Plants": plantsGroup,
      "Data Centers": dcsGroup,
      "Transmission Lines": transmissionGroup,
      "Texas Border": texasBorderLayer
    };
    L.control.layers(null, overlays, { collapsed: true, position: 'bottomleft' }).addTo(map);
  }

  // Load the border layer (local file, fallback if missing)
  loadTexasBorder();
  document.getElementById('resetViewBtn').addEventListener('click', () => map.setView([31.0, -99.0], 6));

  /* Timeline slider */
  const slider = document.getElementById('slider');
  const sliderValue = document.getElementById('sliderValue');
  const plantSearch = document.getElementById('plantSearch');

  plantSearch.addEventListener('input', () => {
    plantSearchQuery = plantSearch.value;
    populatePlants(parseInt(sliderValue.textContent, 10) || maxYear);
  });

  noUiSlider.create(slider, {
    start: [minYear],
    connect: true,
    step: 1,
    range: { min: minYear, max: maxYear },
    tooltips: true,
    format: { to: v => Math.round(v), from: v => Number(v) }
  });

  slider.noUiSlider.on('update', (values, handle) => {
    const y = parseInt(values[handle], 10);
    sliderValue.textContent = y;
    populatePlants(y);
    populateDCs(y);
  });

  slider.noUiSlider.set(minYear);

  /* Fit map to content */
  const bounds = L.featureGroup([plantsGroup, dcsGroup, transmissionGroup]).getBounds();
  if (bounds.isValid()) {
    map.fitBounds(bounds.pad(0.08));
  }

  /* Dynamically set legend height for accurate control offset */
  function updateLegendHeightOffset() {
    const legend = document.getElementById('legend');
    if (!legend) return;
    const h = legend.offsetHeight;
    document.documentElement.style.setProperty('--legend-h', h + 'px');
  }
  window.addEventListener('load', updateLegendHeightOffset);
  window.addEventListener('resize', updateLegendHeightOffset);
  setTimeout(updateLegendHeightOffset, 250); // extra pass after fonts load
  </script>
